server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 503 504 /service-unavailable.html;
    location = /service-unavailable.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>در حال راه‌اندازی</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;font-family:Tahoma,Arial;color:#1f2937}.box{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;max-width:430px;text-align:center;box-shadow:0 12px 32px #00000010}h1{font-size:22px}p{color:#667085;line-height:1.9}</style><div class="box"><h1>سرویس در حال راه‌اندازی است</h1><p>چند ثانیه صبر کنید و صفحه را دوباره بارگذاری کنید.</p></div></html>';
    }
}
